<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hero appearance workbench</title>
<style>
  :root{color-scheme:dark;font:15px system-ui;background:#171821;color:#eee}
  body{max-width:1280px;margin:24px auto;padding:0 20px}h1{font-size:25px;margin-bottom:8px}p{color:#b8bacb;max-width:850px;line-height:1.6}
  .controls{display:flex;flex-wrap:wrap;gap:14px;margin:22px 0}label{display:grid;gap:6px;font-size:13px}select,button{padding:8px;border:1px solid #62677b;border-radius:5px;background:#292c3b;color:white;font:inherit}
  #hero{width:212px;height:318px}.stage{background:#eee9e2;border-radius:8px;padding:10px;display:inline-flex;gap:12px;align-items:center}
  .checker{background-color:#ddd;background-image:conic-gradient(#fff 25%,#ddd 0 50%,#fff 0 75%,#ddd 0);background-size:20px 20px}
  #detail{width:280px;height:280px}#swaps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:18px}
  .tile{background:#292c3b;border:1px solid #414658;border-radius:8px;padding:8px;overflow:hidden}.tile p{font-size:12px;margin:6px 0}.pair{display:flex;gap:5px;justify-content:center}.pair canvas{width:120px;height:180px;background:#e8e3dc}.pair canvas+canvas{background:#11131b}
  #status{min-height:25px;color:#9ce2c2}button{cursor:pointer}a{color:#b5c8ff}@media(max-width:700px){#swaps{grid-template-columns:1fr}.stage{display:flex;flex-wrap:wrap}#detail{width:210px;height:210px}}
</style>
<h1>Hero appearance workbench</h1>
<p>One body, three faces, three hairstyles. Compare registered layers on light and dark backgrounds. The main portrait is capped at the game's 318 px hero height; the square shows the head at source scale.</p>
<div class="controls" id="controls"></div>
<div class="stage checker" id="stage"><canvas id="hero" aria-label="Assembled hero"></canvas><canvas id="detail" aria-label="Head close-up"></canvas></div>
<p id="status" role="status">Loading appearance kit…</p>
<button id="download" type="button">Download assembled PNG</button>
<button id="reset" type="button">Reset appearance</button>
<h2>All face and hair combinations</h2>
<div id="swaps"></div>
<script src="../js/art/hero-kit.js"></script>
<script>
window.kitReady=(async()=>{
  const response=await fetch('../assets/hero/kit/manifest.json');if(!response.ok)throw Error('Appearance manifest unavailable');
  const manifest=await response.json(),controls=document.getElementById('controls'),hero=document.getElementById('hero'),detail=document.getElementById('detail');
  let saved={};try{saved=JSON.parse(localStorage.getItem('hero-kit-preview')||'{}')}catch{}
  let recipe=HeroKit.normalize(manifest,saved),revision=0;
  for(const key of ['face','hair','skin','eyes','hairColor']){
    const label=document.createElement('label');label.textContent={hairColor:'Hair color',skin:'Skin palette',eyes:'Eye color',face:'Face',hair:'Hairstyle'}[key];
    const select=document.createElement('select');select.id=key;select.setAttribute('aria-label',label.textContent);
    const values=key==='face'?manifest.faces:key==='hair'?manifest.hairs:manifest.palettes[key];
    for(const value of Object.keys(values))select.add(new Option(value,value));select.value=recipe[key];
    select.onchange=()=>{recipe[key]=select.value;update().catch(fail)};label.append(select);controls.append(label);
  }
  async function update(){
    const current=++revision,buffer=document.createElement('canvas');await HeroKit.render(buffer,manifest,recipe);if(current!==revision)return;
    hero.width=buffer.width;hero.height=buffer.height;hero.getContext('2d').drawImage(buffer,0,0);
    detail.width=280;detail.height=280;detail.getContext('2d').drawImage(buffer,365,0,280,280,0,0,280,280);
    localStorage.setItem('hero-kit-preview',JSON.stringify(recipe));document.getElementById('status').textContent=`${recipe.face} / ${recipe.hair} · registered 1024 × 1536`;
  }
  document.getElementById('reset').onclick=()=>{recipe={...manifest.defaults};for(const key of Object.keys(recipe))document.getElementById(key).value=recipe[key];update().catch(fail)};
  document.getElementById('download').onclick=()=>{const a=document.createElement('a');a.download=`hero-${recipe.face}-${recipe.hair}.png`;a.href=hero.toDataURL();a.click()};
  await update();
  for(const face of Object.keys(manifest.faces))for(const hair of Object.keys(manifest.hairs)){
    const tile=document.createElement('div');tile.className='tile';const label=document.createElement('p');label.textContent=`${face} / ${hair}`;
    const pair=document.createElement('div');pair.className='pair';const c=document.createElement('canvas');await HeroKit.render(c,manifest,{face,hair});const d=document.createElement('canvas');d.width=c.width;d.height=c.height;d.getContext('2d').drawImage(c,0,0);pair.append(c,d);tile.append(label,pair);document.getElementById('swaps').append(tile);
  }
  window.kitManifest=manifest;window.renderKitPreview=update;return true;
})();
function fail(error){document.getElementById('status').textContent=error.message;console.error(error)}
window.kitReady.catch(fail);
</script>
</html>
